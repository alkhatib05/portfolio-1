<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>اتصل بي - Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>صفحة التواصل</h1>
        <nav>
            <a href="index.html">الرئيسية</a> | 
            <a href="contact.html">اتصل بي</a>
        </nav>
    </header>

    <main>
        <section class="form-section">
            <h2>تواصل معي</h2>
            <form id="contactForm" onsubmit="return validateForm()">
                <label for="fullname">الاسم الكامل:</label><br>
                <input type="text" id="fullname" name="fullname"><br><br>

                <label for="email">البريد الإلكتروني:</label><br>
                <input type="email" id="email" name="email"><br><br>

                <label for="country">الدولة:</label><br>
                <input type="text" id="country" name="country"><br><br>

                <label for="comments">التعليقات / الرسالة:</label><br>
                <textarea id="comments" name="comments" rows="4"></textarea><br><br>

                <button type="submit">إرسال (Submit)</button>
            </form>
        </section>
    </main>

    <!-- JavaScript للتحقق من الحقول -->
    <script>
        function validateForm() {
            var name = document.getElementById('fullname').value;
            var email = document.getElementById('email').value;
            var country = document.getElementById('country').value;
            var comments = document.getElementById('comments').value;

            if (name == "" || email == "" || country == "" || comments == "") {
                alert("الرجاء تعبئة جميع الحقول قبل الإرسال!");
                return false;
            }

            alert("تم إرسال نموذج التواصل بنجاح!");
            return true;
        }
    </script>

</body>
</html>
